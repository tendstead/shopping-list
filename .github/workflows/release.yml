name: Release
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged PR number to publish or retry
        required: true
        type: string
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: shopping-list-release
  # Documented by GitHub; actionlint has not yet added this key to its parser.
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.repository.default_branch }}
      - name: Resolve the merged source and release eligibility
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/release.mjs --target
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.sha }}
      - name: Verify the merged source
        if: steps.target.outputs.release == 'true'
        run: make deps check
      - uses: docker/setup-buildx-action@v3
        if: steps.target.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: steps.target.outputs.release == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Allocate version, publish AMD64 image, then create GitHub release
        if: steps.target.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          PR_NUMBER: ${{ inputs.pr }}
        run: node scripts/release.mjs
